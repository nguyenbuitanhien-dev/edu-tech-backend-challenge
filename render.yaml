services:
  - type: web
    name: edu-tech-backend
    env: node
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
